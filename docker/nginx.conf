worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;

  # Writable paths under /tmp so the container filesystem can stay read-only.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  access_log /dev/stdout;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applies to responses whose location does NOT set its own add_header
    # (nginx cancels header inheritance per-location otherwise).
    include /etc/nginx/security-headers.conf;

    # ---- Local health probe (not the backend health endpoints) ---------
    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # ---- API + backend health: reverse-proxied to the backend perimeter
    # The backend Nginx pins `server_name` (default `localhost`) and rejects
    # unknown Host values, so we send API_HOST_HEADER upstream, not $host.
    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host "${API_HOST_HEADER}";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_ssl_server_name on;
      proxy_ssl_name "${API_HOST_HEADER}";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_pass ${API_UPSTREAM};
    }

    location ^~ /health/ {
      proxy_http_version 1.1;
      proxy_set_header Host "${API_HOST_HEADER}";
      proxy_ssl_server_name on;
      proxy_ssl_name "${API_HOST_HEADER}";
      proxy_pass ${API_UPSTREAM};
    }

    # ---- Static assets: hashed files can be cached hard -----------------
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # ---- SPA fallback --------------------------------------------------
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
